services:
  # 1. L'API FastAPI (Port 8000)
  api:
    build: .
    env_file:
      - .env  # Injecte les variables du fichier .env dans le conteneur
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s 
    environment:
      # Override SERVICE so entrypoint.sh routes to the ingestor branch
      SERVICE: api
    ports:
      - "8000:8000"

  # 2. L'interface Chainlit (Port 8001)
  ui:
    build: .
    env_file:
      - .env  # Injecte les variables du fichier .env dans le conteneur
    environment:
      SERVICE: ui
    ports:
      - "8001:8001"
    depends_on:
      api:
        condition: service_healthy

  # 3. Ingestor job — mirrors the Azure Container App Job
  ingestor:
    build: .
    env_file:
      - .env
    environment:
      SERVICE: ingestor
    # Inherits CMD from Dockerfile (entrypoint.sh), SERVICE env var drives routing
    profiles:
      - ingestor   # Only started explicitly; does not run with `docker compose up`